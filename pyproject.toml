[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "springcraft-cli"
version = "0.1.0"
description = "A Python CLI to generate Spring Boot projects with Spring Initializr and custom templates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12,<1.0",
    "questionary>=2.0,<3.0",
    "httpx>=0.27,<1.0",
    "jinja2>=3.1,<4.0",
    "rich>=13.7,<15.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "respx>=0.21,<1.3"]

[project.scripts]
springcraft = "springcraft.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/springcraft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
